name: conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  run-conformance-test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Build image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: image-local
      -
        name: Start distribution server
        run: |
          IP=`hostname -I | awk '{print $1}'`
          echo "IP=$IP" >> $GITHUB_ENV
          echo "OCI_REGISTRY=$IP:5000" >> $GITHUB_ENV
          DISTRIBUTION_REF="registry:local"
          docker run --rm -p 5000:5000 -e REGISTRY_STORAGE_DELETE_ENABLED=true -idt "registry:local"
      -
        name: Run OCI Distribution Spec conformance tests
        # The conformance tests of the 1.1 spec, including the referrers API,
        # are not part of a tagged release yet.
        uses: opencontainers/distribution-spec@97274622c11112caa21efb8c52acca3c6b8fa7f1 # main
        env:
          OCI_REGISTRY: ${{ env.OCI_REGISTRY }}
          OCI_TLS: disabled
          OCI_REPO1: oci-conformance/distribution-test
          OCI_REPO2: oci-conformance/distribution-test-mount
          OCI_VERSION: "1.1"
          # Content addressed by a digest other than sha256 is not supported.
          OCI_DATA_SHA512: "false"
          # Layers with urls are rejected unless allowed by the configuration,
          # see validation.manifests.urls.
          OCI_DATA_NONDISTRIBUTABLE: "false"
      -
        name: Move test results
        run: mkdir -p out/ && mv {report.html,junit.xml,results.yaml} out/
      -
        name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-test-results-${{ github.sha }}
          path: out/
          if-no-files-found: error
